            export MEOWCHAN_RELEASED102_REAL_BWRAP_PATH="$bwrap_path"
            export MEOWCHAN_RELEASED102_BWRAP_SUDO="$sudo_path"
            export MEOWCHAN_RELEASED102_BWRAP_UID="$expected_uid"
            export MEOWCHAN_RELEASED102_BWRAP_GID="$expected_gid"
            export MEOWCHAN_RELEASED102_UNSHARE_PATH="$unshare_path"
            export MEOWCHAN_RELEASED102_SETPRIV_PATH="$setpriv_path"
