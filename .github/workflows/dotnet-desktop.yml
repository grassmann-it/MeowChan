          consumer=tests/fixtures/upgrade-v1.0.2/current/UpgradeConsumer.csproj
          dotnet restore "$consumer" -p:Configuration=Debug --locked-mode -warnaserror:NU1900
          dotnet build "$consumer" --configuration Debug --no-restore -p:SourceRevisionId="$current_revision" -p:UseSharedCompilation=false -nodeReuse:false
          test_project=tests/MeowChan.DesktopTests/MeowChan.DesktopTests.csproj
          dotnet restore "$test_project" -p:Configuration=Debug -warnaserror:NU1900
          dotnet build "$test_project" --configuration Debug --no-restore -p:SourceRevisionId="$current_revision" -p:UseSharedCompilation=false -nodeReuse:false
          mkdir -p "$fixture/current-test-results"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Ubuntu hosted runners reject the nested unshare uid_map write used
            # by the old boolean path. The ARM hosted image also rejects the
            # unprivileged bwrap uid_map write. Passwordless sudo only creates
            # an outer user namespace whose root is the runner (a root-started
            # bwrap would otherwise map the sandbox UID onto host root and
            # cannot traverse the runner's 0750 home); bwrap then runs inside
            # it, maps back to the runner UID/GID, and the replay never runs
            # as root. The probe proves the host identity by requiring the
            # runner-owned profile to appear runner-owned and writable (an
            # unmapped owner shows as 65534). Do not pass --unshare-net to
            # bwrap: it configures lo via RTM_NEWADDR, which hosted runners may
            # forbid. A short-lived unshare child creates an empty netns, then
            # setpriv removes every capability before the replay. This is a hard
            # capability gate: no handler-only fallback.
            bwrap_path="$(command -v bwrap || true)"
            bwrap_launcher="$GITHUB_WORKSPACE/tests/fixtures/upgrade-v1.0.2/bwrap-root-accessible.sh"
            unshare_path="$(command -v unshare || true)"
            setpriv_path="$(command -v setpriv || true)"
            sudo_path="$(command -v sudo || true)"
            if [[ -z "$bwrap_path" || ! -x "$bwrap_launcher" || -z "$unshare_path" || -z "$setpriv_path" || -z "$sudo_path" ]]; then
              echo "::error::1.0.2 replay requires bwrap, unshare, setpriv and non-interactive sudo for its isolated user+network namespace" >&2
              exit 1
            fi
            sudo_root_uid="$(sudo -n id -u 2>/dev/null || true)"
            if [[ "$sudo_root_uid" != 0 ]]; then
              echo "::error::1.0.2 replay requires non-interactive sudo that is authorized for root-owned bwrap setup; refusing an unisolated replay" >&2
              exit 1
            fi
            host_netns="$(readlink /proc/self/ns/net)"
            expected_uid="$(id -u)"
            expected_gid="$(id -g)"
            probe_script="$(cat <<'PROBE'
          set -eu
          test "$(readlink /proc/self/ns/net)" != "$MEOWCHAN_HOST_NETNS"
          test "$(id -u)" = "$MEOWCHAN_EXPECTED_UID"
          test "$(id -g)" = "$MEOWCHAN_EXPECTED_GID"
          test -d "$MEOWCHAN_EXPECTED_PROFILE"
          test "$(stat -c %u "$MEOWCHAN_EXPECTED_PROFILE")" = "$MEOWCHAN_EXPECTED_UID"
          test -w "$MEOWCHAN_EXPECTED_PROFILE"
          for cap in CapInh CapPrm CapEff CapBnd CapAmb; do
            test "$(awk -v key="$cap:" '$1 == key { print $2 }' /proc/self/status)" = 0000000000000000
          done
          awk -F: 'NR > 2 && $1 !~ /^[[:space:]]*lo[[:space:]]*$/ { bad=1 } END { exit bad+0 }' /proc/net/dev
          awk 'NR > 1 && NF { bad=1 } END { exit bad+0 }' /proc/net/route
          PROBE
          )"
            if ! sudo -n "$bwrap_launcher" --real-bwrap "$bwrap_path" --die-with-parent --unshare-user \
                --uid "$expected_uid" --gid "$expected_gid" \
                --cap-add CAP_SYS_ADMIN --cap-add CAP_SETPCAP --disable-userns \
                --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
                --bind "$profile" "$profile" \
                --setenv MEOWCHAN_HOST_NETNS "$host_netns" \
                --setenv MEOWCHAN_EXPECTED_UID "$expected_uid" \
                --setenv MEOWCHAN_EXPECTED_GID "$expected_gid" \
                --setenv MEOWCHAN_EXPECTED_PROFILE "$profile" -- \
                "$unshare_path" --net -- "$setpriv_path" \
                --bounding-set=-all --inh-caps=-all --ambient-caps=-all --nnp -- \
