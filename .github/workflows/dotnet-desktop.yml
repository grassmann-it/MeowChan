# Graphical harness results are source-build evidence, not packaged apphost evidence.
name: Desktop and library validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full validation, current-source prerelease/stable candidate, package-media playback, native packaging, diagnosis, or optional Homebrew
        type: choice
        required: true
        default: validate
        options:
          - validate
          - prerelease-candidate
          - stable-candidate
          - macos-diagnose
          - macos-package
          - package-media
          - linux-distribution
          - homebrew-macos
      platform:
        description: Native validation platform (all keeps the full validation and packaging checks)
        type: choice
        required: false
        default: all
        options:
          - all
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
          - macos-15
          - macos-15-intel
      scenario:
        description: Native GUI scenarios (gui-only skips offline suites; candidates require all)
        type: choice
        required: false
        default: all
        options:
          - all
          - selection
          - gui-only

permissions:
  contents: read

# Tests and native fixtures stay offline; product defaults are unchanged.
env:
  MEOWCHAN_DISABLE_UPDATE_CHECK: '1'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'validate' }}-${{ inputs.mode == 'validate' && inputs.platform || 'all' }}-${{ inputs.mode == 'validate' && inputs.scenario || 'all' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'validate' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || !inputs.platform || inputs.platform == 'all') && '["ubuntu-24.04","ubuntu-24.04-arm","windows-2022","macos-15","macos-15-intel"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Require the complete current-source candidate matrix
        if: (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
        shell: bash
        run: |
          test "${{ inputs.platform }}" = all
          test "${{ inputs.scenario }}" = all
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record SDK and source commit
        shell: bash
        run: |
          mkdir -p artifacts/build-evidence
          dotnet --info | tee artifacts/build-evidence/sdk.txt
          git rev-parse HEAD > artifacts/build-evidence/source-commit.txt
      - name: Prepare disposable native desktop for wide layout checks
        if: runner.os == 'Windows' || runner.os == 'macOS'
        # The largest exact client scene is 1520x920; reserve 40 DIP for its
        # native frame. Other growth probes explicitly fit the usable work area.
        run: |
          python scripts/prepare-ci-desktop.py --allow-disposable-desktop --min-work-height 960 --report artifacts/build-evidence/native-desktop.json
          python scripts/prepare-ci-desktop.py --allow-disposable-desktop --verify-only --min-work-height 960 --report artifacts/build-evidence/native-desktop-lifetime.json
      - name: Check declared public APIs and require release review for candidates
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        shell: bash
        run: |
          api_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ inputs.mode }}" == prerelease-candidate || "${{ inputs.mode }}" == stable-candidate ]]; then
            api_args+=(--release)
          fi
          python scripts/check-public-api.py "${api_args[@]}"
      - name: Check default development restore and build
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet build MeowChan.csproj -warnaserror:NU1900
      - name: Restore dependencies and require audit availability
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet restore MeowChan.sln -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Retain exact restored Release graphs
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        shell: bash
        run: |
          cp obj/project.assets.json artifacts/build-evidence/desktop-assets.json
          cp libmeowchan/obj/project.assets.json artifacts/build-evidence/library-assets.json
          cp tests/MeowChan.Tests/obj/project.assets.json artifacts/build-evidence/core-tests-assets.json
          cp tests/MeowChan.DesktopTests/obj/project.assets.json artifacts/build-evidence/desktop-tests-assets.json
      - name: Build all production and test projects
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet build MeowChan.sln --configuration Release --no-restore
      - name: Run core and desktop offline tests
        if: runner.os != 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        timeout-minutes: 12
        # Native worker suites retain their own concurrency tests and deadlines.
        # Do not run ten independent test assemblies against the same runner at once.
        run: dotnet test MeowChan.sln --configuration Release --no-build --no-restore -m:1 --logger trx --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 2min --blame-hang-dump-type mini --results-directory test-results
      - name: Run both complete macOS offline suites with bounded diagnostics
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        timeout-minutes: 12
        # Native plugin integration cases can keep progressing beyond five minutes
        # on Intel runners. Keep the core budget and bounded cleanup unchanged.
        run: python3 scripts/macos-test-watchdog.py --timeout 300 --desktop-timeout 600
      - name: Check package layout fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: |
          python -m unittest discover -s tests -p test_macos_packaging.py -v
          python -m unittest discover -s tests -p test_desktop_package.py -v
          python -m unittest discover -s tests -p test_plugin_packaging.py -v
          python -m unittest discover -s tests -p test_prerelease.py -v
          python -m unittest discover -s tests -p test_public_api_policy.py -v
          python -m unittest discover -s tests -p test_ci_desktop_preparation.py -v
          python -m unittest discover -s tests -p test_macos_test_watchdog.py -v
      - name: Check local library package contract fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: python -m unittest discover -s tests -p test_local_package.py -v
      - name: Check GUI runner isolation and cleanup fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: python -m unittest discover -s tests -p test_desktop_smoke_runner.py -v
      - name: Restore graphical harness with reviewed dependencies
        run: dotnet restore tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Retain exact graphical harness dependency graph
        shell: bash
        run: cp tests/MeowChan.DesktopSmoke/obj/project.assets.json artifacts/build-evidence/desktop-smoke-assets.json
      - name: Build graphical harness
        run: dotnet build tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj --configuration Release --no-restore
      - name: Verify plugin delivery in desktop and transitive harness outputs
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) plugin_rid=linux-x64 ;;
            Linux/ARM64) plugin_rid=linux-arm64 ;;
            Windows/X64) plugin_rid=win-x64 ;;
            macOS/X64) plugin_rid=osx-x64 ;;
            macOS/ARM64) plugin_rid=osx-arm64 ;;
            *) echo "Unsupported plugin verification host"; exit 1 ;;
          esac
          python scripts/package-plugins.py --verify bin/Release/net10.0 --runtime "$plugin_rid" --development --report artifacts/build-evidence/desktop-plugins.json
          python scripts/package-plugins.py --verify tests/MeowChan.DesktopSmoke/bin/Release/net10.0 --runtime "$plugin_rid" --development --report artifacts/build-evidence/smoke-plugins.json
      - name: Install Linux virtual display and private session bus
        if: runner.os == 'Linux'
        run: |
          # The hosted x64 Azure mirror can make GUI setup exceed the job deadline.
          # Keep Ubuntu signature verification and ARM's ports mirror unchanged.
          if [[ "$RUNNER_ARCH" == X64 ]]; then
            sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths += list(Path('/etc/apt').glob('apt-mirrors*.txt'))
          for path in paths:
              if path.is_file():
                  before = path.read_text()
                  after = before.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  after = after.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if after != before:
                      path.write_text(after)
          PY
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends vlc libvlc5 libvlccore9 xvfb xauth openbox x11-utils dbus-daemon python3-dbus python3-gi libdbus-1-3 libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core
      - name: Exercise native graphical startup and fallback paths
        # The normal mode renders over 200 screenshots. Native macOS runners can
        # exceed three minutes while still making progress; per-check waits stay bounded.
        run: python scripts/run-desktop-smoke.py --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll --allow-native-desktop --timeout ${{ runner.os == 'macOS' && '300' || '180' }} ${{ inputs.scenario == 'selection' && '--mode selection' || '--mode normal --mode locked-profile --mode no-tray --mode tray-failure --mode download-session --mode reader-ux --mode selection' }} --output artifacts/desktop-smoke
      - name: Exercise tray lifecycle separately on the disposable runner
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: python scripts/run-desktop-smoke.py --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll --allow-native-desktop --timeout 180 --mode tray-lifecycle --output artifacts/desktop-tray-stress
      - name: Check native Linux tray host lifecycle on private DBus
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        run: python scripts/run-desktop-smoke.py --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll --timeout 180 --mode tray-host --output artifacts/desktop-tray-host
      - name: Capture bounded macOS native failure diagnostics
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          evidence = pathlib.Path('artifacts/build-evidence')
          evidence.mkdir(parents=True, exist_ok=True)
          commands = {
              'macos-vm-stat.txt': ['vm_stat'],
              'macos-processes.txt': ['ps', '-axo', 'pid,ppid,rss,state,comm'],
              'macos-native-failures.log': ['/usr/bin/log', 'show', '--last', '10m', '--style', 'compact',
                  '--predicate', '(process == "kernel" OR process == "amfid" OR process == "syspolicyd")'],
          }
          for name, command in commands.items():
              with tempfile.TemporaryFile() as output:
                  try:
                      result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=20, check=False)
                      status = f'exit_code={result.returncode}\n'
                  except (OSError, subprocess.TimeoutExpired) as error:
                      status = f'diagnostic_error={error}\n'
                  # Keep only a bounded tail; diagnostics never change the original failure result.
                  output.seek(0, 2)
                  length = output.tell()
                  output.seek(max(0, length - 256 * 1024))
                  (evidence / name).write_bytes(status.encode() + output.read(256 * 1024))
          PY
      - name: Upload regression and graphical evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}-${{ runner.arch }}
          path: |
            test-results/**
            artifacts/desktop-smoke/**
            artifacts/desktop-tray-host/**
            artifacts/desktop-tray-stress/**
            artifacts/build-evidence/**
            artifacts/macos-test-diagnosis/**
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'selection' && 2 || 14 }}

  library-package:
    if: github.event_name != 'workflow_dispatch' || ((inputs.mode == 'validate' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')) && inputs.scenario == 'all')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check plugin package consumer integrity fixtures
        run: python -m unittest discover -s tests -p test_plugin_packages.py -v
      - name: Restore the library, SDK and Host dependency graphs
        run: |
          dotnet restore libmeowchan/libmeowchan.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
          dotnet restore MeowChan.PluginSdk/MeowChan.PluginSdk.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
          dotnet restore MeowChan.PluginHost/MeowChan.PluginHost.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Pack the library, SDK and Host into one local feed
        run: |
          dotnet pack libmeowchan/libmeowchan.csproj --configuration Release --no-restore --output artifacts/packages -p:RepositoryCommit=${{ github.sha }}
          dotnet pack MeowChan.PluginSdk/MeowChan.PluginSdk.csproj --configuration Release --no-restore --output artifacts/packages -p:RepositoryCommit=${{ github.sha }}
          dotnet pack MeowChan.PluginHost/MeowChan.PluginHost.csproj --configuration Release --no-restore --output artifacts/packages -p:RepositoryCommit=${{ github.sha }}
      # PackageReference evidence only; delivered helper/product probes run separately.
      # The plugin consumer runner owns its build lock; do not add an outer flock.
      - name: Consume the Core, SDK and Host packages outside the repository in a fresh cache
        run: python scripts/test-plugin-packages.py --feed artifacts/packages --output artifacts/plugin-package-consumers
      - name: Retain local library, SDK and Host package candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-package-candidate
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - name: Retain local library package consumer evidence separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-package-consumer-evidence
          path: artifacts/plugin-package-consumers/core-consumer-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain plugin package consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-consumer-evidence
          path: artifacts/plugin-package-consumers/**
          if-no-files-found: warn
          retention-days: 7

  package:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode == 'validate' && inputs.scenario == 'all' && (!inputs.platform || inputs.platform == 'all'))
    needs: [validate, library-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record SDK and source commit
        shell: bash
        run: |
          mkdir -p artifacts/build-evidence
          dotnet --info | tee artifacts/build-evidence/sdk.txt
          git rev-parse HEAD > artifacts/build-evidence/source-commit.txt
      - name: Read product version
        id: metadata
        shell: bash
        run: |
          package_version="$(dotnet msbuild MeowChan.csproj -nologo -getProperty:Version)"
          artifact_version="$package_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            preview_prefix="v${package_version}-preview."
            if [[ "$GITHUB_REF_NAME" == "v$package_version" ]]; then
              artifact_version="$package_version"
            elif [[ "$GITHUB_REF_NAME" == "$preview_prefix"* && "${GITHUB_REF_NAME#"$preview_prefix"}" =~ ^[1-9][0-9]*$ ]]; then
              artifact_version="${GITHUB_REF_NAME#v}"
            else
              echo "Tag $GITHUB_REF_NAME does not match project version $package_version or its preview sequence."
              exit 1
            fi
          fi
          echo "version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "product_version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Restore selected runtime
        run: dotnet restore MeowChan.csproj -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Configuration=Release --locked-mode -p:SelfContained=true -p:PublishSingleFile=true -warnaserror:NU1900
      - name: Publish self-contained application
        run: dotnet publish MeowChan.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=true --output publish-output/${{ matrix.runtime }}
      - name: Validate slim distribution and selected external video runtime
        run: |
          python scripts/check-desktop-package.py publish-output/${{ matrix.runtime }} ${{ matrix.runtime }}
          python scripts/package-plugins.py --verify publish-output/${{ matrix.runtime }} --runtime ${{ matrix.runtime }}
          python scripts/check-video-native.py publish-output/${{ matrix.runtime }} ${{ matrix.runtime }}
      - name: Retain resolved publish dependency and runtime packs
        shell: bash
        run: |
          cp obj/project.assets.json artifacts/build-evidence/publish-assets.json
          cp libmeowchan/obj/project.assets.json artifacts/build-evidence/library-assets.json
      - name: Package and re-extract Windows output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages, extracted | Out-Null
          $archive = "packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "publish-output/${{ matrix.runtime }}/*" -DestinationPath $archive
          Expand-Archive -Path $archive -DestinationPath extracted
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8
      - name: Validate extracted external video runtime
        shell: bash
        run: |
          python scripts/check-desktop-package.py extracted ${{ matrix.runtime }}
          python scripts/package-plugins.py --verify extracted --runtime ${{ matrix.runtime }}
          python scripts/check-video-native.py extracted ${{ matrix.runtime }}
      - name: Document package-check boundary
        shell: bash
        run: |
          echo "Prepared ${{ matrix.runtime }} archive from $GITHUB_SHA on $RUNNER_OS/$RUNNER_ARCH." >> "$GITHUB_STEP_SUMMARY"
          echo "Archive contents/permissions were checked. This job does not execute the extracted MeowChan apphost. Native release acceptance remains separately recorded." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain package candidate
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.runtime }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain publish evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-evidence-${{ matrix.runtime }}
          path: artifacts/build-evidence/**
          if-no-files-found: warn
          retention-days: 7

  macos-package:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode == 'validate' && inputs.scenario == 'all' && (!inputs.platform || inputs.platform == 'all')) || inputs.mode == 'macos-package' || inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            os: macos-15
            cpu: arm64
          - runtime: osx-x64
            os: macos-15-intel
            cpu: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record native host and source
        shell: bash
        run: |
          mkdir -p artifacts/macos-evidence
          test "$(uname -m)" = "${{ matrix.cpu }}"
          uname -a | tee artifacts/macos-evidence/host.txt
          sw_vers | tee -a artifacts/macos-evidence/host.txt
          clang --version >> artifacts/macos-evidence/host.txt
          xcrun --sdk macosx --show-sdk-version >> artifacts/macos-evidence/host.txt
          git rev-parse HEAD > artifacts/macos-evidence/source.txt
          dotnet --info > artifacts/macos-evidence/sdk.txt
      - name: Test packager and signing contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_macos*.py' -v
          python3 -m unittest discover -s tests -p test_desktop_package.py -v
          python3 -m unittest discover -s tests -p test_plugin_packaging.py -v
      - name: Read product version
        id: metadata
        shell: bash
        run: |
          version="$(dotnet msbuild MeowChan.csproj -nologo -getProperty:Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > artifacts/macos-evidence/version.txt
      # Keep the reviewed ILLink.Tasks lock graph while exposing all runtime Mach-O files.
      - name: Restore native self-contained app with visible runtime libraries
        run: dotnet restore MeowChan.csproj --artifacts-path artifacts/macos-build -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Configuration=Release --locked-mode -p:SelfContained=true -p:PublishSingleFile=false -p:EnableSingleFileAnalyzer=true -warnaserror:NU1900
      - name: Publish native self-contained app
        run: dotnet publish MeowChan.csproj --artifacts-path artifacts/macos-build -c Release -r ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=false -p:EnableSingleFileAnalyzer=true --output artifacts/macos-publish
      - name: Validate visible .NET and bundled video runtime before signing
        shell: bash
        run: |
          for library in libcoreclr.dylib libclrjit.dylib libhostfxr.dylib libhostpolicy.dylib; do
            test -f "artifacts/macos-publish/$library"
          done
          python3 scripts/check-desktop-package.py artifacts/macos-publish ${{ matrix.runtime }}
          python3 scripts/package-plugins.py --verify artifacts/macos-publish --runtime ${{ matrix.runtime }}
          python3 scripts/check-video-native.py artifacts/macos-publish ${{ matrix.runtime }}
      - name: Sign app inside-out and verify ZIP round trip
        run: python3 scripts/package-macos.py --publish-dir artifacts/macos-publish --output-dir artifacts/macos-bundle --version ${{ steps.metadata.outputs.version }} --runtime ${{ matrix.runtime }} --sign-adhoc --archive artifacts/macos-packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}.zip
      - name: Create DMG and verify mounted, copied app and Applications shortcut
        run: python3 scripts/package-macos-dmg.py --bundle artifacts/macos-bundle/MeowChan.app --dmg artifacts/macos-packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}.dmg --copied-root artifacts/macos-extracted --runtime ${{ matrix.runtime }} > artifacts/macos-evidence/dmg.json
      - name: Retain signature and closure evidence from DMG-installed app
        shell: bash
        run: |
          archive="artifacts/macos-packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}.dmg"
          python3 scripts/check-desktop-package.py artifacts/macos-extracted/MeowChan.app/Contents/MacOS ${{ matrix.runtime }} > artifacts/macos-evidence/contents.json
          python3 scripts/macos-signing.py artifacts/macos-extracted/MeowChan.app --runtime ${{ matrix.runtime }} > artifacts/macos-evidence/signatures.json
          python3 scripts/check-video-native.py artifacts/macos-extracted/MeowChan.app/Contents/Resources/application ${{ matrix.runtime }} > artifacts/macos-evidence/video-tree.json
          python3 scripts/package-plugins.py --verify artifacts/macos-extracted/MeowChan.app/Contents/Resources/application --runtime ${{ matrix.runtime }} --report artifacts/macos-evidence/plugins.json
          shasum -a 256 "$archive" > "$archive.sha256"
          cp "$archive.sha256" artifacts/macos-evidence/archive.sha256
          echo "Native self-contained ad-hoc DMG; mounted and copied app verified. No Developer ID, notarization or Gatekeeper acceptance claim. Real VLC playback remains a separate acceptance check." >> "$GITHUB_STEP_SUMMARY"
      - name: Start and gracefully stop the actual DMG-installed apphost
        run: python3 scripts/macos-apphost-smoke.py artifacts/macos-extracted/MeowChan.app/Contents/MacOS/MeowChan --evidence-dir artifacts/macos-evidence
      - name: Exercise native gallery playback from the DMG-installed apphost
        if: inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
        run: python3 scripts/apphost-playback-smoke.py artifacts/macos-extracted/MeowChan.app/Contents/MacOS/MeowChan --allow-native-desktop --evidence-dir artifacts/macos-evidence/playback
      - name: Exercise the DMG-installed apphost download, restore, export and desktop workflow
        if: inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
        run: python3 scripts/apphost-workflow-smoke.py artifacts/macos-extracted/MeowChan.app/Contents/MacOS/MeowChan --archive artifacts/macos-packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}.zip --archive-member MeowChan.app/Contents/MacOS/MeowChan --archive-root artifacts/macos-extracted --allow-native-desktop --source-commit ${{ github.sha }} --runtime ${{ matrix.runtime }} --evidence-dir artifacts/macos-evidence/workflow
      - name: Retain playback-verified native DMG candidate, inventory ZIP and evidence
        if: inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-candidate-${{ matrix.runtime }}
          path: |
            artifacts/macos-packages/*.dmg
            artifacts/macos-packages/*.zip
            artifacts/macos-evidence/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain native macOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-evidence-${{ matrix.runtime }}
          path: artifacts/macos-evidence/**
          if-no-files-found: warn
          retention-days: 7

  package-media:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
            cpu: X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record native host and source
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.cpu }}"
          mkdir -p artifacts/media-evidence
          git rev-parse HEAD > artifacts/media-evidence/source.txt
          dotnet --info > artifacts/media-evidence/sdk.txt
          uname -a > artifacts/media-evidence/host.txt
      - name: Check runner evidence validation
        run: |
          python -m unittest discover -s tests -p test_apphost_playback_runner.py -v
          python -m unittest discover -s tests -p test_apphost_workflow_runner.py -v
          python -m unittest discover -s tests -p test_desktop_package.py -v
          python -m unittest discover -s tests -p test_plugin_packaging.py -v
      - name: Restore the actual release package contract
        run: dotnet restore MeowChan.csproj --artifacts-path artifacts/media-build -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Configuration=Release --locked-mode -p:SelfContained=true -p:PublishSingleFile=true -warnaserror:NU1900
      - name: Publish self-contained single-file application
        run: dotnet publish MeowChan.csproj --artifacts-path artifacts/media-build -c Release -r ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=true --output artifacts/media-publish
      - name: Validate slim distribution and selected native video runtime
        run: |
          python scripts/check-desktop-package.py artifacts/media-publish ${{ matrix.runtime }}
          python scripts/package-plugins.py --verify artifacts/media-publish --runtime ${{ matrix.runtime }}
          python scripts/check-video-native.py artifacts/media-publish ${{ matrix.runtime }}
      - name: ZIP and extract the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/media-packages, artifacts/media-extracted | Out-Null
          $archive = "artifacts/media-packages/MeowChan-${{ matrix.runtime }}.zip"
          Compress-Archive -Path "artifacts/media-publish/*" -DestinationPath $archive
          Expand-Archive -Path $archive -DestinationPath artifacts/media-extracted
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content artifacts/media-evidence/archive.sha256 -Encoding utf8
          if (-not (Test-Path artifacts/media-extracted/MeowChan.exe -PathType Leaf)) { throw "Missing extracted apphost" }
      - name: Check extracted distribution and native video layout
        run: |
          python scripts/check-desktop-package.py artifacts/media-extracted ${{ matrix.runtime }}
          python scripts/package-plugins.py --verify artifacts/media-extracted --runtime ${{ matrix.runtime }}
          python scripts/check-video-native.py artifacts/media-extracted ${{ matrix.runtime }}
      - name: Play both WebM codecs through the extracted Windows apphost
        if: runner.os == 'Windows'
        run: python scripts/apphost-playback-smoke.py artifacts/media-extracted/MeowChan.exe --allow-native-desktop --evidence-dir artifacts/media-evidence/playback
      - name: Exercise the extracted Windows apphost workflow
        if: runner.os == 'Windows'
        run: python scripts/apphost-workflow-smoke.py artifacts/media-extracted/MeowChan.exe --archive artifacts/media-packages/MeowChan-${{ matrix.runtime }}.zip --archive-member MeowChan.exe --allow-native-desktop --source-commit ${{ github.sha }} --runtime ${{ matrix.runtime }} --evidence-dir artifacts/media-evidence/workflow
      - name: Retain playback-verified Windows archive and evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-media-candidate-${{ matrix.runtime }}
          path: |
            artifacts/media-packages/*
            artifacts/media-evidence/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain native package playback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-media-evidence-${{ matrix.runtime }}
          path: artifacts/media-evidence/**
          if-no-files-found: warn
          retention-days: 7

  linux-distribution:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'package-media' || inputs.mode == 'linux-distribution' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-24.04
            cpu: X64
          - runtime: linux-arm64
            os: ubuntu-24.04-arm
            cpu: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record native distribution host and exact source
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.cpu }}"
          mkdir -p artifacts/linux-evidence
          git rev-parse HEAD > artifacts/linux-evidence/source.txt
          dotnet --info > artifacts/linux-evidence/sdk.txt
          uname -a > artifacts/linux-evidence/host.txt
          cat /etc/os-release >> artifacts/linux-evidence/host.txt
      - name: Enable matching Ubuntu source repositories
        shell: bash
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          updated = 0
          for path in files:
              text = path.read_text()
              if 'ubuntu' not in text.lower():
                  continue
              text, count = re.subn(r'^Types: deb\s*$', 'Types: deb deb-src', text, flags=re.MULTILINE)
              if count:
                  path.write_text(text)
              if re.search(r'^Types:.*\bdeb-src\b', text, flags=re.MULTILINE):
                  updated += 1
          if not updated:
              raise SystemExit('Native Ubuntu runner has no enabled deb-src repository')
          PY
      - name: Install native packaging inputs
        shell: bash
        run: |
          # The hosted x64 Azure mirror can stall native package setup.
          # Keep Ubuntu signature verification and ARM's ports mirror unchanged.
          if [[ "$RUNNER_ARCH" == X64 ]]; then
            sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths += list(Path('/etc/apt').glob('apt-mirrors*.txt'))
          for path in paths:
              if path.is_file():
                  before = path.read_text()
                  after = before.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  after = after.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if after != before:
                      path.write_text(after)
          PY
          fi
          sudo apt-get update
          sudo apt-get install --yes libvlc5 libvlccore9 vlc-plugin-base vlc-plugin-video-output vlc-data patchelf binutils gcc dpkg-dev squashfs-tools
          dpkg-query -W > artifacts/linux-evidence/host-packages.txt
      - name: Check Linux packaging, provenance and isolated runner contracts
        shell: bash
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_linux*.py' -v
          python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_apphost*runner.py' -v
          python3 -W error::ResourceWarning -m unittest discover -s tests -p test_desktop_package.py -v
          python3 -W error::ResourceWarning -m unittest discover -s tests -p test_plugin_packaging.py -v
      - name: Read product version
        id: metadata
        shell: bash
        run: |
          version="$(dotnet msbuild MeowChan.csproj -nologo -getProperty:Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > artifacts/linux-evidence/version.txt
      - name: Restore and publish the native self-contained apphost
        shell: bash
        run: |
          dotnet restore MeowChan.csproj --artifacts-path artifacts/linux-build -p:RuntimeIdentifier=${{ matrix.runtime }} -p:Configuration=Release --locked-mode -p:SelfContained=true -p:PublishSingleFile=true -warnaserror:NU1900
          dotnet publish MeowChan.csproj --artifacts-path artifacts/linux-build -c Release -r ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=true --output artifacts/linux-publish
          python3 scripts/check-desktop-package.py artifacts/linux-publish ${{ matrix.runtime }}
          python3 scripts/package-plugins.py --verify artifacts/linux-publish --runtime ${{ matrix.runtime }}
      - name: Prepare the selected private VLC runtime and pinned AppImage tools
        shell: bash
        run: |
          python3 scripts/package-linux.py refresh-runtime-packages --runtime ${{ matrix.runtime }}
          python3 scripts/package-linux.py prepare-runtime --runtime ${{ matrix.runtime }} --output-dir artifacts/linux-runtime/${{ matrix.runtime }}
          python3 scripts/package-linux.py download-tools --runtime ${{ matrix.runtime }} --output-dir artifacts/appimage-tools/${{ matrix.runtime }}
      - name: Build bundled VLC, system VLC and AppImage distributions
        run: python3 scripts/package-linux.py package --publish-dir artifacts/linux-publish --runtime ${{ matrix.runtime }} --version ${{ steps.metadata.outputs.version }} --source-commit ${{ github.sha }} --runtime-dir artifacts/linux-runtime/${{ matrix.runtime }}/runtime --runtime-manifest artifacts/linux-runtime/${{ matrix.runtime }}/runtime-manifest.json --tools-dir artifacts/appimage-tools/${{ matrix.runtime }} --output-dir artifacts/linux-packages
      - name: Gather exact corresponding Linux and AppImage runtime sources
        run: python3 scripts/package-linux-sources.py --manifest ${{ matrix.runtime }}=artifacts/linux-runtime/${{ matrix.runtime }}/runtime-manifest.json --source-commit ${{ github.sha }} --output artifacts/linux-packages/MeowChan-${{ steps.metadata.outputs.version }}-${{ matrix.runtime }}-video-sources.tar.gz --download-dir artifacts/linux-source-inputs
      - name: Build separate disposable desktops with and without system VLC
        shell: bash
        run: |
          docker build --pull --target no-vlc --tag meowchan-gates:no-vlc - < scripts/linux-distribution-gates.Dockerfile
          docker build --target system-vlc --tag meowchan-gates:system-vlc - < scripts/linux-distribution-gates.Dockerfile
          docker image inspect meowchan-gates:no-vlc meowchan-gates:system-vlc > artifacts/linux-evidence/desktop-images.json
      - name: Accept all three exact distributions on native CPU without network or host desktop
        run: python3 scripts/linux-distribution-gates.py --package-dir artifacts/linux-packages --manifest artifacts/linux-packages/${{ matrix.runtime }}-package-manifest.json --no-vlc-image meowchan-gates:no-vlc --system-vlc-image meowchan-gates:system-vlc --source-commit ${{ github.sha }} --runtime ${{ matrix.runtime }} --evidence-dir artifacts/linux-evidence/distributions
      - name: Retain accepted Linux archives, AppImage and corresponding sources
        uses: actions/upload-artifact@v7
        with:
          name: linux-distribution-candidate-${{ matrix.runtime }}
          path: |
            artifacts/linux-packages/*
            artifacts/linux-evidence/**
            artifacts/linux-runtime/${{ matrix.runtime }}/runtime-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain Linux distribution failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-distribution-evidence-${{ matrix.runtime }}
          path: artifacts/linux-evidence/**
          if-no-files-found: warn
          retention-days: 7

  macos-source-candidate:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'package-media' || (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate'))
    needs: [macos-package, package-media, linux-distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: macos-native-candidate-*
          path: artifacts/macos-inputs
      - name: Require matching native playback evidence and exact source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, shutil, subprocess, zipfile
          spec = importlib.util.spec_from_file_location('workflow_runner', 'scripts/apphost-workflow-smoke.py')
          workflow_runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(workflow_runner)
          root = pathlib.Path('artifacts/macos-inputs')
          output = pathlib.Path('artifacts/macos-candidate')
          output.mkdir(parents=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA'], 'Checkout differs from dispatched source'
          expected = {'osx-arm64', 'osx-x64'}
          assert {p.name.removeprefix('macos-native-candidate-') for p in root.iterdir()} == expected
          versions = set()
          for rid in sorted(expected):
              directory = root / ('macos-native-candidate-' + rid)
              evidence = directory / 'macos-evidence'
              assert (evidence / 'source.txt').read_text().strip() == commit, 'Native source mismatch'
              version = (evidence / 'version.txt').read_text().strip()
              versions.add(version)
              dmg = directory / 'macos-packages' / f'MeowChan-{version}-{rid}.dmg'
              digest = hashlib.file_digest(dmg.open('rb'), 'sha256').hexdigest()
              assert (evidence / 'archive.sha256').read_text().split()[0] == digest, 'Final DMG hash mismatch'
              dmg_report = json.loads((evidence / 'dmg.json').read_text())
              assert dmg_report['runtime'] == rid and dmg_report['dmg'] == dmg.name
              assert dmg_report['dmgSha256'] == digest and dmg_report['mountedAndCopied'] is True
              assert dmg_report['applicationsShortcut'] == '/Applications'
              assert dmg_report['sourceSignatures']['files'] == dmg_report['copiedSignatures']['files']
              archive = directory / 'macos-packages' / f'MeowChan-{version}-{rid}.zip'
              archive_digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
              signatures = json.loads((evidence / 'signatures.json').read_text())
              assert signatures['runtime'] == rid
              assert all(signatures[key] is True for key in ('signatures_verified', 'dependency_closure', 'coreclr_entitlements_verified'))
              assert signatures['files'] == dmg_report['copiedSignatures']['files'], 'DMG-installed signature inventory mismatch'
              startup = json.loads((evidence / 'apphost-startup.json').read_text())
              assert startup['passed'] is True and startup['exit_code'] == 0 and startup['outer_timeout'] is False
              playback = json.loads((evidence / 'playback/playback.json').read_text())
              assert playback['passed'] is True and playback['isolatedDesktop'] is False
              workflow = json.loads((evidence / 'workflow/workflow.json').read_text())
              assert workflow['passed'] is True and workflow['completed'] is True
              assert workflow['declaredSourceCommit'] == commit and workflow['declaredRuntime'] == rid
              assert workflow['archiveBinding']['sha256'] == archive_digest
              closure = workflow['archiveClosure']
              assert closure['verifiedBeforeRun'] is True and closure['verifiedAfterRun'] is True
              archive_entries = workflow_runner.archive_entries(archive)
              for key, value in archive_entries.items():
                  assert closure[key] == value, 'Workflow managed/native closure differs from final ZIP: ' + key
              assert closure['afterContentSha256'] == closure['contentSha256'], 'Executed bundle changed during workflow'
              closure_files = {row['path']: row for row in closure['entries'] if row['kind'] == 'file'}
              assert workflow['scales'], 'Workflow has no executed scale'
              for scale in workflow['scales']:
                  assert scale['passed'] is True
                  assert len(scale['phases']) == 4
                  assert {phase['phase'] for phase in scale['phases']} == {'download', 'restore', 'removed', 'shutdown'}
                  for phase in scale['phases']:
                      assert phase['passed'] is True and phase['managedAssemblyBindingVerified'] is True
                      bindings = phase['managedAssemblyBindings']
                      assert {row['name'] for row in bindings} == {'MeowChan', 'libmeowchan'}
                      for row in bindings:
                          assert row['archivePath'].startswith('MeowChan.app/Contents/Resources/application/')
                          assert closure_files[row['archivePath']]['sha256'] == row['sha256'], 'Loaded managed assembly differs from final ZIP'
              fixtures = json.loads(pathlib.Path('tests/Fixtures/gallery-playback-manifest.json').read_text())['files']
              assert len(playback['fixtures']) == 2
              assert {row['fixtureSha256'] for row in playback['fixtures']} == {row['sha256'] for row in fixtures}
              assert all(row['passed'] is True and row['exitCode'] == 0 and row['timedOut'] is False for row in playback['fixtures'])
              with zipfile.ZipFile(archive) as package:
                  for name, expected_hash in signatures['files'].items():
                      assert hashlib.sha256(package.read('MeowChan.app/' + name)).hexdigest() == expected_hash, 'ZIP/signature evidence mismatch'
                  apphost_hash = hashlib.sha256(package.read('MeowChan.app/Contents/MacOS/MeowChan')).hexdigest()
              assert playback['apphostSha256'] == apphost_hash, 'Playback apphost differs from final ZIP'
              assert workflow['apphostSha256'] == apphost_hash == workflow['archiveBinding']['memberSha256'], 'Workflow apphost differs from final ZIP'
              assert dmg_report['apphostSha256'] == apphost_hash, 'Mounted DMG apphost differs from inventory ZIP'
              shutil.copy2(dmg, output / dmg.name)
              shutil.copytree(evidence, output / 'evidence' / rid)
              shutil.copy2(archive, output / 'evidence' / rid / archive.name)
              report = {'source_commit': commit, 'rid': rid, 'dmg_sha256': digest,
                        'inventory_zip_sha256': archive_digest, 'dmg_validation': dmg_report,
                        'signatures': signatures, 'startup': startup, 'playback': playback, 'workflow': workflow}
              (output / f'{rid}-native-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          assert len(versions) == 1, 'Native versions differ'
          (output / 'version.txt').write_text(versions.pop() + '\n')
          (output / 'source.txt').write_text(commit + '\n')
          PY
      - name: Fetch and verify the unchanged public source base on CI only
        shell: bash
        run: |
          mkdir -p artifacts/source-base
          base=artifacts/source-base/MeowChan-0.9.0-video-sources.tar.gz
          curl --fail --location --retry 3 --max-time 300 --output "$base" https://github.com/grassmann-it/MeowChan/releases/download/v0.9.0/10-MeowChan-0.9.0-video-sources.tar.gz
          test "$(stat -c %s "$base")" = 725131331
          echo "bf556da3dd1fb511dafb81f684a0bb6fc38e7cb7b91081e9ac0c307bd0771bfa  $base" | sha256sum --check --strict
      - name: Generate source overlay bound to both final native DMGs
        shell: bash
        run: |
          candidate=artifacts/macos-candidate
          version="$(cat "$candidate/version.txt")"
          python3 scripts/package-macos-sources.py \
            --source-commit "$GITHUB_SHA" --version "$version" \
            --base artifacts/source-base/MeowChan-0.9.0-video-sources.tar.gz \
            --binary-zip "osx-arm64=$candidate/evidence/osx-arm64/MeowChan-$version-osx-arm64.zip" \
            --binary-zip "osx-x64=$candidate/evidence/osx-x64/MeowChan-$version-osx-x64.zip" \
            --binary-dmg "osx-arm64=$candidate/MeowChan-$version-osx-arm64.dmg" \
            --binary-dmg "osx-x64=$candidate/MeowChan-$version-osx-x64.dmg" \
            --validation-report "osx-arm64=$candidate/osx-arm64-native-validation.json" \
            --validation-report "osx-x64=$candidate/osx-x64-native-validation.json" \
            --output "$candidate/MeowChan-$version-macos-video-source-overlay.tar.gz" \
            > "$candidate/source-overlay.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          candidate = pathlib.Path('artifacts/macos-candidate')
          overlay = next(candidate.glob('*-macos-video-source-overlay.tar.gz'))
          with tarfile.open(overlay) as archive:
              manifest = json.load(archive.extractfile('manifest.json'))
          assert manifest['application_source_commit'] == os.environ['GITHUB_SHA']
          assert set(manifest['architectures']) == {'osx-arm64', 'osx-x64'}
          for rid, record in manifest['architectures'].items():
              binary = candidate / record['signed_dmg']['file']
              with binary.open('rb') as data:
                  assert hashlib.file_digest(data, 'sha256').hexdigest() == record['signed_dmg']['sha256']
          base = manifest['source_base']
          base['url'] = 'https://github.com/grassmann-it/MeowChan/releases/download/v0.9.0/10-' + base['file']
          (candidate / 'source-base.json').write_text(json.dumps(base, indent=2) + '\n')
          (candidate / 'README.txt').write_text('CI candidates only; no public release. Both DMGs and the source overlay bind to source.txt. ZIPs are retained only for inventory verification.\nUse the unchanged public source base identified in source-base.json together with the overlay.\nThe base is not duplicated in this CI artifact. A future release must offer both source assets.\nNative signatures are ad-hoc; no Developer ID, notarization, Gatekeeper or physical audio acceptance claim.\n')
          lines = []
          for path in sorted(candidate.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  with path.open('rb') as data:
                      lines.append(hashlib.file_digest(data, 'sha256').hexdigest() + '  ' + path.relative_to(candidate).as_posix() + '\n')
          (candidate / 'SHA256SUMS').write_text(''.join(lines))
          PY
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)
      - name: Retain paired native DMG and source-overlay candidates
        uses: actions/upload-artifact@v7
        with:
          name: macos-paired-candidate-${{ github.sha }}
          path: artifacts/macos-candidate/**
          if-no-files-found: error
          retention-days: 7

  # Explicit opt-in: same-run full validation plus all five native package jobs.
  # Actions artifacts only. The retained v0.9 upload workflow is deliberately separate.
  current-source-inventory:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
    needs: [validate, library-package, macos-source-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: '*candidate*'
          path: artifacts/current-source-inputs
      - name: Fetch the pinned corresponding-source base
        shell: bash
        run: |
          mkdir -p artifacts/source-base
          base=artifacts/source-base/MeowChan-0.9.0-video-sources.tar.gz
          curl --fail --location --retry 3 --max-time 300 --output "$base" https://github.com/grassmann-it/MeowChan/releases/download/v0.9.0/10-MeowChan-0.9.0-video-sources.tar.gz
          test "$(stat -c %s "$base")" = 725131331
          echo "bf556da3dd1fb511dafb81f684a0bb6fc38e7cb7b91081e9ac0c307bd0771bfa  $base" | sha256sum --check --strict
      - name: Verify actual managed identities, source pairing, legal files and asset inventory
        shell: bash
        run: |
          version="$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').findtext('.//Version'))")"
          channel=prerelease
          if [[ "${{ inputs.mode }}" == stable-candidate ]]; then channel=stable; fi
          python3 scripts/assemble-prerelease.py --channel "$channel" --artifacts-root artifacts/current-source-inputs --source-commit "$GITHUB_SHA" --version "$version" --source-base artifacts/source-base/MeowChan-0.9.0-video-sources.tar.gz --run-id "$GITHUB_RUN_ID" --output artifacts/${{ inputs.mode }}
          (cd artifacts/${{ inputs.mode }} && sha256sum --check --strict SHA256SUMS)
      - name: Retain current-source candidate inventory and assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.mode }}-${{ github.sha }}
          path: artifacts/${{ inputs.mode }}/*
          if-no-files-found: error
          retention-days: 7

  # Diagnostic evidence only: this mode does not run or satisfy release validation.
  macos-diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'macos-diagnose'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record diagnostic source and SDK
        shell: bash
        run: |
          mkdir -p artifacts/macos-test-diagnosis
          git rev-parse HEAD > artifacts/macos-test-diagnosis/source.txt
          dotnet --info > artifacts/macos-test-diagnosis/sdk.txt
      - name: Restore reviewed dependencies for both complete test suites
        timeout-minutes: 4
        run: dotnet restore MeowChan.sln -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Build all production and test projects
        timeout-minutes: 4
        run: dotnet build MeowChan.sln --configuration Release --no-restore
      - name: Diagnose Core then Desktop independently
        timeout-minutes: 12
        run: python3 scripts/macos-test-watchdog.py --timeout 300
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-diagnosis-${{ github.run_id }}
          path: artifacts/macos-test-diagnosis/**
          if-no-files-found: warn
          retention-days: 14

  # Native source-build/structure evidence; GUI, playback and audio are separate gates.
  homebrew-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'homebrew-macos'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Initialize private Homebrew paths
        shell: bash
        run: |
          echo "HOMEBREW_TEMP=$RUNNER_TEMP/meowchan-homebrew/tmp" >> "$GITHUB_ENV"
          echo "HOMEBREW_LOGS=$RUNNER_TEMP/meowchan-homebrew/evidence/brew-logs" >> "$GITHUB_ENV"
          echo "MEOWCHAN_PROFILE=$RUNNER_TEMP/meowchan-homebrew/profile" >> "$GITHUB_ENV"
      - name: Record native Homebrew source-build inputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/meowchan-homebrew/evidence"
          mkdir -p "$evidence" "$HOMEBREW_TEMP"
          git rev-parse HEAD > "$evidence/checkout-commit.txt"
          brew --version > "$evidence/brew-version.txt"
          brew config > "$evidence/brew-config.txt"
          sw_vers > "$evidence/os.txt"
          uname -m > "$evidence/cpu.txt"
          cp packaging/homebrew/input-manifest.json "$evidence/"
          shasum -a 256 packaging/homebrew/Formula/meowchan.rb > "$evidence/formula.sha256"
      - name: Update Homebrew and stage local validation tap
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/meowchan-homebrew/evidence"
          brew update 2>&1 | tee "$evidence/update.log"
          brew tap-new --no-git meowchan-local/validation
          install -m 644 packaging/homebrew/Formula/meowchan.rb "$(brew --repository meowchan-local/validation)/Formula/meowchan.rb"
      - name: Install pinned source formula natively
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          brew install --build-from-source --verbose meowchan-local/validation/meowchan 2>&1 | tee "$RUNNER_TEMP/meowchan-homebrew/evidence/install.log"
      - name: Check installed Mach-O and signing structure
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/meowchan-homebrew/evidence"
          brew test --verbose meowchan-local/validation/meowchan 2>&1 | tee "$evidence/test.log"
          brew info --json=v2 meowchan-local/validation/meowchan > "$evidence/installed.json"
          echo "Homebrew source installation and structural tests passed. GUI, playback and real audio remain unverified." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Homebrew source-build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/meowchan-homebrew/evidence/**
          if-no-files-found: warn
          retention-days: 14
