# Graphical harness results are source-build evidence, not packaged apphost evidence.
name: Desktop and library validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full validation, current-source prerelease/stable candidate, package-media playback, native packaging, diagnosis, or optional Homebrew
        type: choice
        required: true
        default: validate
        options:
          - validate
          - offline-retest
          - prerelease-candidate
          - stable-candidate
          - macos-diagnose
          - macos-package
          - package-media
          - linux-distribution
          - homebrew-macos
      platform:
        description: Native validation platform (all keeps the full validation and packaging checks)
        type: choice
        required: false
        default: all
        options:
          - all
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
          - macos-15
          - macos-15-intel
      offline_lane:
        description: Lane for offline-retest only (ubuntu/windows, scenario all; no GUI, packaging or candidate work)
        type: choice
        required: false
        default: lane-c
        options:
          - lane-a
          - lane-b
          - lane-c
          - lane-d
      scenario:
        description: Native GUI scenarios (Focused gallery/GIF/media-input/tray diagnostics; candidates require all)
        type: choice
        required: false
        default: all
        options:
          - all
          - selection
          - gui-only
          - gallery-errors
          - gallery-features
          - gif-playback
          - media-input
          - tray-lifecycle

permissions:
  contents: read

# Tests and native fixtures stay offline; product defaults are unchanged.
env:
  MEOWCHAN_DISABLE_UPDATE_CHECK: '1'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'validate' }}-${{ inputs.mode == 'validate' && inputs.platform || 'all' }}-${{ inputs.mode == 'validate' && inputs.scenario || 'all' }}-${{ inputs.mode == 'offline-retest' && inputs.offline_lane || 'none' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'validate' || inputs.mode == 'offline-retest' || inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.mode == 'offline-retest') && ((!inputs.platform || inputs.platform == 'all') && format('{{"include":[{{"os":"ubuntu-24.04","lane":"{0}","full":false}},{{"os":"ubuntu-24.04-arm","lane":"{0}","full":false}},{{"os":"windows-2022","lane":"{0}","full":false}}]}}', inputs.offline_lane) || format('{{"include":[{{"os":"{0}","lane":"{1}","full":false}}]}}', inputs.platform, inputs.offline_lane)) || (github.event_name != 'workflow_dispatch' || !inputs.platform || inputs.platform == 'all') && ((github.event_name != 'workflow_dispatch' || !inputs.scenario || inputs.scenario == 'all' || inputs.scenario == 'gui-only') && '{"include":[{"os":"ubuntu-24.04","lane":"lane-a","full":true},{"os":"ubuntu-24.04","lane":"lane-b","full":false},{"os":"ubuntu-24.04","lane":"lane-c","full":false},{"os":"ubuntu-24.04","lane":"lane-d","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-a","full":true},{"os":"ubuntu-24.04-arm","lane":"lane-b","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-c","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-d","full":false},{"os":"windows-2022","lane":"lane-a","full":true},{"os":"windows-2022","lane":"lane-b","full":false},{"os":"windows-2022","lane":"lane-c","full":false},{"os":"windows-2022","lane":"lane-d","full":false},{"os":"macos-15","lane":"native","full":true,"mac_shard":1},{"os":"macos-15","lane":"native-02","full":false,"mac_shard":2},{"os":"macos-15","lane":"native-03","full":false,"mac_shard":3},{"os":"macos-15","lane":"native-04","full":false,"mac_shard":4},{"os":"macos-15","lane":"native-05","full":false,"mac_shard":5},{"os":"macos-15","lane":"native-06","full":false,"mac_shard":6},{"os":"macos-15","lane":"native-07","full":false,"mac_shard":7},{"os":"macos-15","lane":"native-08","full":false,"mac_shard":8},{"os":"macos-15-intel","lane":"native","full":true,"mac_shard":1},{"os":"macos-15-intel","lane":"native-02","full":false,"mac_shard":2},{"os":"macos-15-intel","lane":"native-03","full":false,"mac_shard":3},{"os":"macos-15-intel","lane":"native-04","full":false,"mac_shard":4},{"os":"macos-15-intel","lane":"native-05","full":false,"mac_shard":5},{"os":"macos-15-intel","lane":"native-06","full":false,"mac_shard":6},{"os":"macos-15-intel","lane":"native-07","full":false,"mac_shard":7},{"os":"macos-15-intel","lane":"native-08","full":false,"mac_shard":8}]}' || '{"include":[{"os":"ubuntu-24.04","lane":"lane-a","full":true},{"os":"ubuntu-24.04","lane":"lane-b","full":false},{"os":"ubuntu-24.04","lane":"lane-c","full":false},{"os":"ubuntu-24.04","lane":"lane-d","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-a","full":true},{"os":"ubuntu-24.04-arm","lane":"lane-b","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-c","full":false},{"os":"ubuntu-24.04-arm","lane":"lane-d","full":false},{"os":"windows-2022","lane":"lane-a","full":true},{"os":"windows-2022","lane":"lane-b","full":false},{"os":"windows-2022","lane":"lane-c","full":false},{"os":"windows-2022","lane":"lane-d","full":false},{"os":"macos-15","lane":"native","full":true,"mac_shard":1},{"os":"macos-15-intel","lane":"native","full":true,"mac_shard":1}]}') || (inputs.platform == 'macos-15' || inputs.platform == 'macos-15-intel') && ((github.event_name != 'workflow_dispatch' || !inputs.scenario || inputs.scenario == 'all' || inputs.scenario == 'gui-only') && format('{{"include":[{{"os":"{0}","lane":"native","full":true,"mac_shard":1}},{{"os":"{0}","lane":"native-02","full":false,"mac_shard":2}},{{"os":"{0}","lane":"native-03","full":false,"mac_shard":3}},{{"os":"{0}","lane":"native-04","full":false,"mac_shard":4}},{{"os":"{0}","lane":"native-05","full":false,"mac_shard":5}},{{"os":"{0}","lane":"native-06","full":false,"mac_shard":6}},{{"os":"{0}","lane":"native-07","full":false,"mac_shard":7}},{{"os":"{0}","lane":"native-08","full":false,"mac_shard":8}}]}}', inputs.platform) || format('{{"include":[{{"os":"{0}","lane":"native","full":true,"mac_shard":1}}]}}', inputs.platform)) || format('{{"include":[{{"os":"{0}","lane":"lane-a","full":true}},{{"os":"{0}","lane":"lane-b","full":false}},{{"os":"{0}","lane":"lane-c","full":false}},{{"os":"{0}","lane":"lane-d","full":false}}]}}', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    # Existing checks, scoped native regressions and two genuine old-release replays.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        id: checkout_source
        with:
          fetch-depth: 0 # Genuine 1.0.0/1.0.1 replay uses the exact historical tags.
      - name: Reject offline retest outside its bounded scope
        id: offline_retest_guard
        # Fail closed: an invalid scope stops the job before any other work.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'offline-retest'
        shell: bash
        env:
          RETEST_LANE: ${{ inputs.offline_lane }}
          RETEST_PLATFORM: ${{ inputs.platform }}
          RETEST_SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$RETEST_LANE" in lane-a|lane-b|lane-c|lane-d) ;; *) echo "invalid offline_lane: $RETEST_LANE" >&2; exit 1;; esac
          case "$RETEST_PLATFORM" in macos-*) echo "offline-retest does not support macOS" >&2; exit 1;; esac
          test "$RUNNER_OS" != macOS
          test "$RETEST_SCENARIO" = all
      - name: Require the complete current-source candidate matrix
        id: candidate_matrix
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate')
        shell: bash
        run: |
          test "${{ inputs.platform }}" = all
          test "${{ inputs.scenario }}" = all
      - uses: actions/setup-dotnet@v6
        id: setup_dotnet
        with:
          global-json-file: global.json
      - name: Record SDK and source commit
        id: record_source
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/build-evidence
          dotnet --info | tee artifacts/build-evidence/sdk.txt
          git rev-parse HEAD > artifacts/build-evidence/source-commit.txt
      - name: Prepare disposable native desktop for wide layout checks
        id: prepare_desktop
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only'))) && (runner.os == 'Windows' || runner.os == 'macOS')
        # The largest exact client scene is 1520x920; reserve 40 DIP for its
        # native frame. Other growth probes explicitly fit the usable work area.
        run: |
          python scripts/prepare-ci-desktop.py --allow-disposable-desktop --min-work-height 960 --report artifacts/build-evidence/native-desktop.json
          python scripts/prepare-ci-desktop.py --allow-disposable-desktop --verify-only --min-work-height 960 --report artifacts/build-evidence/native-desktop-lifetime.json
      - name: Check declared public APIs and require release review for candidates
        id: public_api
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        shell: bash
        run: |
          api_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ inputs.mode }}" == prerelease-candidate || "${{ inputs.mode }}" == stable-candidate ]]; then
            api_args+=(--release)
          fi
          python scripts/check-public-api.py "${api_args[@]}"
      - name: Check default development restore and build
        id: dev_build
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet build MeowChan.csproj -warnaserror:NU1900
      - name: Restore dependencies and require audit availability
        id: restore_release
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet restore MeowChan.sln -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Retain exact restored Release graphs
        id: retain_release_assets
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        shell: bash
        run: |
          cp obj/project.assets.json artifacts/build-evidence/desktop-assets.json
          cp libmeowchan/obj/project.assets.json artifacts/build-evidence/library-assets.json
          cp tests/MeowChan.Tests/obj/project.assets.json artifacts/build-evidence/core-tests-assets.json
          cp tests/MeowChan.DesktopTests/obj/project.assets.json artifacts/build-evidence/desktop-tests-assets.json
      - name: Build all production and test projects
        id: build_all
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'all'
        run: dotnet build MeowChan.sln --configuration Release --no-restore
      - name: Build process-test probe in the test configuration
        id: process_probe
        # The probe is a non-solution project referenced without an assembly
        # reference, so solution builds otherwise leave only its Debug output.
        # Process tests require the matching Release artifact.
        continue-on-error: true
        if: runner.os != 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        run: dotnet build tests/PluginReauthorizationProbe/PluginReauthorizationProbe.csproj --configuration Release --no-restore
      - name: Run core and desktop offline test shards
        id: core_tests
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: runner.os != 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        # The Python runner gives every dotnet host a hard deadline and owns its
        # process tree. Desktop class-LPT cells share the existing two-host queue
        # with unchanged non-Desktop owners and one absolute lane deadline.
        timeout-minutes: 35
        shell: bash
        run: |
          # A focused offline-retest executes only this lane's cell + unchanged
          # project owners. It is NOT a four-lane/platform coverage proof.
          python scripts/run-dotnet-shards.py --lane "${{ matrix.lane }}" \
            --desktop-platform "${{ matrix.os }}" --source "$(git rev-parse HEAD)" \
            --results-root test-results/offline-shards
      - name: Run native macOS offline test shard with bounded diagnostics
        id: mac_tests
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        # Eight native machines partition each compiled inventory; no suite replay.
        # Discovery is INCLUDED in the unchanged 300/600s (candidate 390/810s)
        # bounds. Leave two minutes for diagnostic sampling and group cleanup.
        timeout-minutes: 22
        run: |
          watchdog_args=()
          if [[ "${{ inputs.mode }}" == prerelease-candidate || "${{ inputs.mode }}" == stable-candidate ]]; then
            watchdog_args=(--candidate-validation)
          fi
          python3 scripts/run-macos-test-shards.py run --shard "${{ matrix.mac_shard }}" \
            --platform "${{ matrix.os }}" --source "$(git rev-parse HEAD)" "${watchdog_args[@]}"
      - name: Check package layout fixtures
        id: package_fixtures
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'media-input')
        shell: bash
        run: |
          set -euo pipefail
          # Collect every fixture suite; retain a failure even if later suites pass.
          fixture_status=0
          python -m unittest discover -s tests -p test_macos_packaging.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_desktop_package.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_plugin_packaging.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_plugin_documentation.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_prerelease.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_release_gates.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_ap04_candidate_workflow.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_released102_fixture_generation.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_released102_migrated_check.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_public_api_policy.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_ci_desktop_preparation.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_validation_gate.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_tray_lifecycle_selector.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_macos_test_watchdog.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_macos_test_shards.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_desktop_four_lane_shards.py -v || fixture_status=$?
          python -m unittest discover -s tests -p test_dotnet_desktop_workflow_contract.py -v || fixture_status=$?
          exit "$fixture_status"
      - name: Check local library package contract fixtures
        id: local_package
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        run: python -m unittest discover -s tests -p test_local_package.py -v
      - name: Check GUI runner isolation and cleanup fixtures
        id: smoke_runner_contract
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        shell: bash
        run: |
          status=0
          python -m unittest discover -s tests -p test_desktop_smoke_runner.py -v || status=$?
          python -m unittest discover -s tests -p test_gui_ci_scenes.py -v || status=$?
          python -m unittest discover -s tests/gui-ci-orchestration -v || status=$?
          exit "$status"
      - name: Restore graphical harness with reviewed dependencies
        id: smoke_restore
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only')))
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        run: dotnet restore tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Retain exact graphical harness dependency graph
        id: smoke_assets
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only')))
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        shell: bash
        run: cp tests/MeowChan.DesktopSmoke/obj/project.assets.json artifacts/build-evidence/desktop-smoke-assets.json
      - name: Build graphical harness
        id: smoke_build
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only')))
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        run: dotnet build tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj --configuration Release --no-restore
      - name: Verify plugin delivery in desktop and transitive harness outputs
        id: plugin_delivery
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only')))
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) plugin_rid=linux-x64 ;;
            Linux/ARM64) plugin_rid=linux-arm64 ;;
            Windows/X64) plugin_rid=win-x64 ;;
            macOS/X64) plugin_rid=osx-x64 ;;
            macOS/ARM64) plugin_rid=osx-arm64 ;;
            *) echo "Unsupported plugin verification host"; exit 1 ;;
          esac
          python scripts/package-plugins.py --verify bin/Release/net10.0 --runtime "$plugin_rid" --development --report artifacts/build-evidence/desktop-plugins.json
          python scripts/package-plugins.py --verify tests/MeowChan.DesktopSmoke/bin/Release/net10.0 --runtime "$plugin_rid" --development --report artifacts/build-evidence/smoke-plugins.json
      - name: Install Linux virtual display and private session bus
        id: linux_setup
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only'))) && (runner.os == 'Linux')
        run: |
          # The hosted x64 Azure mirror can make GUI setup exceed the job deadline.
          # Keep Ubuntu signature verification and ARM's ports mirror unchanged.
          if [[ "$RUNNER_ARCH" == X64 ]]; then
            sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths += list(Path('/etc/apt').glob('apt-mirrors*.txt'))
          for path in paths:
              if path.is_file():
                  before = path.read_text()
                  after = before.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  after = after.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if after != before:
                      path.write_text(after)
          PY
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends vlc libvlc5 libvlccore9 xvfb xauth openbox x11-utils dbus-daemon python3-dbus python3-gi libdbus-1-3 libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core pulseaudio pulseaudio-utils bubblewrap
      - name: Exercise native graphical startup and fallback paths
        id: smoke_normal
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: (matrix.full || (inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only'))) && (github.event_name != 'workflow_dispatch' || (inputs.scenario != 'gallery-errors' && inputs.scenario != 'gallery-features' && inputs.scenario != 'gif-playback' && inputs.scenario != 'media-input' && inputs.scenario != 'tray-lifecycle'))
        # Each normal scope has a fresh process/profile and its own bounded evidence.
        shell: bash
        env:
          GUI_CI_SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          python scripts/run-gui-ci-scenes.py \
            --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll \
            --timeout "${{ runner.os == 'macOS' && '300' || '180' }}" \
            ${{ runner.os != 'Linux' && '--allow-native-desktop' || '' }} \
            ${{ inputs.scenario == 'selection' && '--selection-only' || '' }} \
            ${{ inputs.mode != 'offline-retest' && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only') && format('--shard {0} --workers {1}', matrix.mac_shard || (matrix.lane == 'lane-a' && 1 || matrix.lane == 'lane-b' && 2 || matrix.lane == 'lane-c' && 3 || 4), runner.os == 'macOS' && 8 || 4) || '' }} \
            --output artifacts/desktop-smoke

      # Dedicated Program.cs branches return before the ordinary normal/reader-ux
      # paths. Each gets its own process/profile/evidence; never combine selectors.
      # Linux uses the runner's private Xvfb/DBus/WM, not a host DISPLAY. Only the
      # disposable Windows/macOS runners opt into native desktop access.
      # Native media/volume failures remain failures: these are not physical-audio
      # acceptance or a reason to silently skip unavailable hosted audio devices.
      - name: Exercise explicit bundled new-selection confirmation on the actual platform
        id: smoke_plugins
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && ((github.event_name != 'workflow_dispatch' || inputs.scenario == 'all' || inputs.scenario == 'gui-only') && runner.os == 'Linux')
        shell: bash
        env:
          MEOWCHAN_PLUGIN_RESELECTION_ONLY: '1'
        run: |
          python scripts/gui-ci-safety.py
          python scripts/run-desktop-smoke.py --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll ${{ runner.os != 'Linux' && '--allow-native-desktop' || '' }} --mode plugins --timeout 300 --output artifacts/closure-plugin-reselection
      - name: Exercise selected 1.1 registry workflows on Linux x64
        id: smoke_1_1_registry
        # The registry runner isolates entries and continues after individual failures;
        # the candidate gate below still rejects this step unless every entry passes.
        continue-on-error: true
        if: matrix.full && (github.event_name == 'workflow_dispatch' && (inputs.mode == 'prerelease-candidate' || inputs.mode == 'stable-candidate') && runner.os == 'Linux' && runner.arch == 'X64')
        run: |
          python scripts/gui-ci-safety.py
          python scripts/run-desktop-smoke.py \
            --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll \
            --registry --only booru-workbench \
            --only booru-composition \
            --only booru-media \
            --only tagging-page \
            --only tagging-mode \
            --only media-page \
            --only media-page-booru-captures \
            --only media-menu-surfaces \
            --only settings-reader-display \
            --timeout 300 \
            --output artifacts/desktop-smoke-1.1-registry
      - name: Replay genuine 1.0.0 and 1.0.1 profiles with confirmed new selections
        id: upgrade_replay
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        shell: bash
        run: |
          python scripts/gui-ci-safety.py
          set -euo pipefail
          for version in 1.0.0 1.0.1; do
            fixture="$GITHUB_WORKSPACE/artifacts/upgrade-$version"
