      - name: Exercise the released 1.0.2 fixture against the current source
        id: upgrade_102_replay
        # Keep independent checks running so one failure yields a complete evidence set.
        continue-on-error: true
        if: matrix.full && (github.event_name != 'workflow_dispatch' || inputs.scenario == 'all')
        shell: bash
        run: |
          python scripts/gui-ci-safety.py
          set -euo pipefail
          # The current-side consumer must use the same Debug configuration as
          # the AP04 test assembly. Mixing Debug and Release changes the
          # MeowChan.dll byte identity and is rejected by the provenance control.
