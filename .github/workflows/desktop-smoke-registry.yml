# UNVERIFIED BY CONSTRUCTION: this workflow was written without pushing or triggering it, so it has
# never run on GitHub. Its runner mode (scripts/run-desktop-smoke.py --registry) was exercised locally
# on private Xvfb only. Treat the first scheduled or manual run as its first test.
#
# Nightly source-built GUI sweep over every DesktopSmoke registry entry (SmokeScenarios.All).
# Manual (workflow_dispatch) and scheduled only: it adds no push or pull_request trigger and leaves
# dotnet-desktop.yml, which runs on pushes, unchanged.
# Linux private Xvfb/Openbox only; not packaged apphost evidence. Entries the registry marks as
# skipped (external drivers, provenance-bound evidence runs) are listed in the summary, not run.
# GitHub runs the schedule only for the default branch's copy of this file.
name: Desktop smoke registry

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Space-separated registry ids to run (empty runs the whole registry)
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Tests and native fixtures stay offline; product defaults are unchanged.
env:
  MEOWCHAN_DISABLE_UPDATE_CHECK: '1'

concurrency:
  group: desktop-smoke-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Record SDK and source commit
        shell: bash
        run: |
          mkdir -p artifacts/build-evidence
          dotnet --info | tee artifacts/build-evidence/sdk.txt
          git rev-parse HEAD > artifacts/build-evidence/source-commit.txt
      - name: Restore graphical harness with reviewed dependencies
        run: dotnet restore tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj -p:Configuration=Release --locked-mode -warnaserror:NU1900
      - name: Build graphical harness
        run: dotnet build tests/MeowChan.DesktopSmoke/MeowChan.DesktopSmoke.csproj --configuration Release --no-restore
      - name: Verify plugin delivery in the harness output
        run: python scripts/package-plugins.py --verify tests/MeowChan.DesktopSmoke/bin/Release/net10.0 --runtime linux-x64 --development --report artifacts/build-evidence/smoke-plugins.json
      - name: Install Linux virtual display, private session bus and null audio
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends vlc libvlc5 libvlccore9 xvfb xauth openbox x11-utils dbus-daemon python3-dbus python3-gi libdbus-1-3 libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core pulseaudio pulseaudio-utils
      - name: Check GUI runner isolation and registry fixtures
        run: python -m unittest discover -s tests -p test_desktop_smoke_runner.py -v
      - name: Run every registry entry in its own isolated process
        shell: bash
        env:
          ONLY: ${{ inputs.only }}
        run: |
          only=()
          for id in $ONLY; do only+=(--only "$id"); done
          python scripts/run-desktop-smoke.py --assembly tests/MeowChan.DesktopSmoke/bin/Release/net10.0/MeowChan.DesktopSmoke.dll \
            --registry --timeout 600 "${only[@]}" --output artifacts/desktop-smoke-registry
      - name: Summarize registry results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path('artifacts/desktop-smoke-registry/registry.json')
          if not path.exists():
              print('No registry report was written.')
              raise SystemExit
          report = json.loads(path.read_text())
          print('| id | status | scenario | reason or first failure |')
          print('|---|---|---|---|')
          for result in report['results']:
              attempt = (result.get('attempts') or [{}])[-1]
              reason = result.get('reason') or (attempt.get('error') if result['status'] == 'failed' else '') or ''
              print(f"| {result['id']} | {result['status']} | {result.get('scenario', '')} | {reason.replace('|', '/')} |")
          print()
          print('Counts: ' + ', '.join(f'{key} {value}' for key, value in report['counts'].items()))
          if not report.get('complete'):
              print()
              print('The sweep did not finish; entries after the last row did not run.')
          PY
      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-registry
          path: |
            artifacts/desktop-smoke-registry/**
            artifacts/build-evidence/**
          if-no-files-found: warn
          retention-days: 14
