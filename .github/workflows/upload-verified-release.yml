name: Upload verified 0.9.0 release assets
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful retained Windows and macOS package-media run ID
        required: true
        default: '39696624077'
      source_commit:
        description: Exact final Linux and release source commit
        required: true
      linux_run:
        description: Successful Linux-only distribution run ID
        required: true
      retained_source_commit:
        description: Exact accepted Windows and macOS source commit
        required: true
        default: b0888df84c3f3facf9dff6b1aaa6167eb1cf190e
      release_id:
        description: Existing draft release ID
        required: true
        default: '420167100'
permissions:
  contents: write
  actions: read
concurrency:
  group: upload-verified-v0.9.0
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      LINUX_RUN: ${{ inputs.linux_run }}
      RETAINED_SOURCE: ${{ inputs.retained_source_commit }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Check the immutable successful source run
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LINUX_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$RETAINED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion > retained-run.json
          gh run view "$LINUX_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion > linux-run.json
          python3 - <<'PY'
          import json, os
          for file, source in [('retained-run.json', 'RETAINED_SOURCE'), ('linux-run.json', 'SOURCE_COMMIT')]:
              r = json.load(open(file))
              assert r['headSha'] == os.environ[source]
              assert r['status'] == 'completed' and r['conclusion'] == 'success'
          PY
      - name: Download accepted candidates and the immutable common source base
        run: |
          python3 - <<'PY'
          import concurrent.futures, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          commands = []
          for run, names in [
              (os.environ['SOURCE_RUN'], ['native-media-candidate-win-x64', 'macos-paired-candidate-' + os.environ['RETAINED_SOURCE']]),
              (os.environ['LINUX_RUN'], ['linux-distribution-candidate-linux-x64', 'linux-distribution-candidate-linux-arm64']),
          ]:
              for name in names:
                  commands.append(['gh', 'run', 'download', run, '--repo', repo, '--name', name, '--dir', 'candidates/' + name])
          commands.append(['gh', 'release', 'download', 'v0.9.0-preview.3', '--repo', repo, '--pattern', 'MeowChan-0.9.0-video-sources.tar.gz', '--dir', 'source-base'])
          # Independent immutable inputs use separate directories; await every transfer
          # before the assembler verifies the complete set and any release upload starts.
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
              futures = [executor.submit(subprocess.run, command, check=True) for command in commands]
              for future in futures:
                  future.result()
          PY
      - name: Verify source, native package evidence, paired sources and exact asset inventory
        run: python3 scripts/assemble-stable-release.py --artifacts-root candidates --source-commit "$SOURCE_COMMIT" --windows-source-commit "$RETAINED_SOURCE" --macos-source-commit "$RETAINED_SOURCE" --source-base source-base/MeowChan-0.9.0-video-sources.tar.gz --output staged
      - name: Upload verified assets to the existing draft without publishing
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/' + os.environ['RELEASE_ID']]))
          assert release['tag_name'] == 'v0.9.0'
          assert release['draft'] is True and release['prerelease'] is False
          assert release['target_commitish'] == os.environ['SOURCE_COMMIT']
          order = ['win-x64.zip', 'osx-arm64.dmg', 'osx-x64.dmg', 'linux-x64.AppImage', 'linux-arm64.AppImage', 'linux-x64-bundled-vlc.tar.gz', 'linux-x64-system-vlc.tar.gz', 'linux-arm64-bundled-vlc.tar.gz', 'linux-arm64-system-vlc.tar.gz', 'video-sources.tar.gz', 'macos-video-source-overlay.tar.gz', 'linux-x64-video-sources.tar.gz', 'linux-arm64-video-sources.tar.gz']
          names = ['MeowChan-0.9.0-' + name for name in order] + ['SHA256SUMS']
          assert set(names) == {p.name for p in Path('staged').iterdir()}
          record = {'schema': 'meowchan.verified-release-upload.v1',
                    'releaseId': release['id'], 'sourceCommit': os.environ['SOURCE_COMMIT'],
                    'retainedSourceCommit': os.environ['RETAINED_SOURCE'],
                    'sourceRun': os.environ['SOURCE_RUN'], 'linuxRun': os.environ['LINUX_RUN'],
                    'assets': []}
          existing = {a['name']: a for a in release['assets']}
          assert set(existing).issubset(names)
          for name in names:
              path = Path('staged') / name
              with path.open('rb') as f:
                  digest = 'sha256:' + hashlib.file_digest(f, 'sha256').hexdigest()
              record['assets'].append({'name': name, 'bytes': path.stat().st_size, 'digest': digest})
          def upload(row):
              name = row['name']
              old = existing.get(name)
              if old and old['state'] == 'uploaded' and old['size'] == row['bytes'] and old.get('digest') == row['digest']:
                  print('Already verified:', name, flush=True)
                  return
              subprocess.run(['gh', 'release', 'upload', 'v0.9.0', str(Path('staged') / name), '--repo', repo, '--clobber'], check=True)
              print('Uploaded:', name, flush=True)
          # Upload the primary binaries first (GitHub displays assets alphabetically by
          # filename regardless of upload order); remaining distinct assets can
          # transfer concurrently. A receipt is written only after every upload succeeds.
          for row in record['assets'][:5]:
              upload(row)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures = [executor.submit(upload, row) for row in record['assets'][5:]]
              for future in futures:
                  future.result()
          record['passed'] = True
          Path('release-upload-record.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
      - name: Retain the exact uploaded inventory and checksums
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-upload-record
          path: |
            release-upload-record.json
            staged/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
