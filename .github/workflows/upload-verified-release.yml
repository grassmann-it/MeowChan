name: Upload verified 0.9.0 release assets
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful package-media run ID
        required: true
        default: '39696624077'
      source_commit:
        description: Exact package source commit
        required: true
        default: b0888df84c3f3facf9dff6b1aaa6167eb1cf190e
permissions:
  contents: write
  actions: read
concurrency:
  group: upload-verified-v0.9.0
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Check the immutable successful source run
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['headSha'] == os.environ['SOURCE_COMMIT']
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          PY
      - name: Download accepted candidates and the immutable common source base
        run: |
          for name in native-media-candidate-win-x64 linux-distribution-candidate-linux-x64 linux-distribution-candidate-linux-arm64 "macos-paired-candidate-$SOURCE_COMMIT"; do
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "candidates/$name"
          done
          gh release download v0.9.0-preview.3 --repo "$GITHUB_REPOSITORY" --pattern MeowChan-0.9.0-video-sources.tar.gz --dir source-base
      - name: Verify source, native package evidence, paired sources and exact asset inventory
        run: python3 scripts/assemble-stable-release.py --artifacts-root candidates --source-commit "$SOURCE_COMMIT" --source-base source-base/MeowChan-0.9.0-video-sources.tar.gz --output staged
      - name: Upload verified assets to the existing draft without publishing
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/v0.9.0']))
          assert release['draft'] is True and release['prerelease'] is False
          assert release['target_commitish'] == os.environ['SOURCE_COMMIT']
          order = ['win-x64.zip', 'osx-arm64.dmg', 'osx-x64.dmg', 'linux-x64.AppImage', 'linux-arm64.AppImage', 'linux-x64-bundled-vlc.tar.gz', 'linux-x64-system-vlc.tar.gz', 'linux-arm64-bundled-vlc.tar.gz', 'linux-arm64-system-vlc.tar.gz', 'video-sources.tar.gz', 'macos-video-source-overlay.tar.gz', 'linux-x64-video-sources.tar.gz', 'linux-arm64-video-sources.tar.gz']
          names = ['MeowChan-0.9.0-' + name for name in order] + ['SHA256SUMS']
          assert set(names) == {p.name for p in Path('staged').iterdir()}
          existing = {a['name']: a for a in release['assets']}
          assert set(existing).issubset(names)
          for name in names:
              path = Path('staged') / name
              with path.open('rb') as f:
                  digest = 'sha256:' + hashlib.file_digest(f, 'sha256').hexdigest()
              old = existing.get(name)
              if old and old['state'] == 'uploaded' and old['size'] == path.stat().st_size and old.get('digest') == digest:
                  print('Already verified:', name, flush=True)
                  continue
              subprocess.run(['gh', 'release', 'upload', 'v0.9.0', str(path), '--repo', repo, '--clobber'], check=True)
              print('Uploaded:', name, flush=True)
          PY
