name: Upload verified release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (1.2.0 or later); empty uses the product Version from Directory.Build.props at the source commit
        required: false
        default: ''
      source_run:
        description: Successful same-source stable-candidate run ID
        required: true
      source_commit:
        description: Exact commit shared by all release packages
        required: true
      release_id:
        description: Existing draft release ID for the tag v<version>
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: upload-verified-${{ inputs.version || inputs.source_commit }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_ID: ${{ inputs.release_id }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - name: Resolve the release version
        run: |
          # An explicit input wins; otherwise the product version at the exact
          # source commit decides, so the workflow no longer pins one release.
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="$(python3 -c "import re,sys; m=re.search(r'<Version>([^<]+)</Version>', open('Directory.Build.props', encoding='utf-8').read()); print(m.group(1).strip() if m else '')")"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid release version: '$version'"; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Uploading release v$version"
      - name: Check the immutable successful stable candidate run
        run: |
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,conclusion,jobs > candidate-run.json
          python3 scripts/aggregate-release-gates.py run \
            --json-file candidate-run.json \
            --expected-sha "$SOURCE_COMMIT" \
            --required-job "Release candidate gate" \
            --report release-run-gate.json
      - name: Download the exact stable candidate assets
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "stable-candidate-$SOURCE_COMMIT" --dir candidate
      - name: Verify source pairing and stage the exact public asset bytes
        run: |
          if ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y 7zip
          fi
          python3 scripts/assemble-stable-release.py --candidate-dir candidate --candidate-run-id "$SOURCE_RUN" \
            --source-commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --output staged
          (cd staged && sha256sum --check --strict SHA256SUMS)
      - name: Upload verified assets to the existing draft without publishing
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, importlib.util, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/' + os.environ['RELEASE_ID']]))
          version = os.environ['RELEASE_VERSION']
          assert release['tag_name'] == 'v' + version
          assert release['draft'] is True and release['prerelease'] is False
          assert release['target_commitish'] == os.environ['SOURCE_COMMIT']
          spec = importlib.util.spec_from_file_location('video_sources', 'scripts/assemble-video-sources.py')
          sources = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sources)
          names = sources.public_names(version) + ['SHA256SUMS']
          assert set(names) == {p.name for p in Path('staged').iterdir()}
          record = {'schema': 'meowchan.verified-release-upload.v1',
                    'releaseId': release['id'], 'sourceCommit': os.environ['SOURCE_COMMIT'],
                    'version': version, 'sourceRun': os.environ['SOURCE_RUN'],
                    'assets': []}
          existing = {a['name']: a for a in release['assets']}
          assert set(existing).issubset(names)
          for name in names:
              path = Path('staged') / name
              with path.open('rb') as f:
                  digest = 'sha256:' + hashlib.file_digest(f, 'sha256').hexdigest()
              record['assets'].append({'name': name, 'bytes': path.stat().st_size, 'digest': digest})
          # Readable display labels (GitHub shows them instead of the file names), as on 1.0.2.
          LABELS = {'win-x64.zip': 'Windows x64 (.zip)', 'osx-arm64.dmg': 'macOS Apple Silicon (.dmg)', 'osx-x64.dmg': 'macOS Intel (.dmg)',
                    'linux-x64.AppImage': 'Linux x64 (.AppImage)', 'linux-arm64.AppImage': 'Linux ARM64 (.AppImage)',
                    'linux-x64-bundled-vlc.tar.gz': 'Linux x64 \u2014 bundled VLC (.tar.gz)', 'linux-x64-system-vlc.tar.gz': 'Linux x64 \u2014 system VLC (.tar.gz)',
                    'linux-arm64-bundled-vlc.tar.gz': 'Linux ARM64 \u2014 bundled VLC (.tar.gz)', 'linux-arm64-system-vlc.tar.gz': 'Linux ARM64 \u2014 system VLC (.tar.gz)',
                    'current-video-sources.7z': 'Current video sources (.7z)'}
          def upload(row):
              name = row['name']
              old = existing.get(name)
              if old and old['state'] == 'uploaded' and old['size'] == row['bytes'] and old.get('digest') == row['digest']:
                  print('Already verified:', name, flush=True)
                  return
              subprocess.run(['gh', 'release', 'upload', 'v' + version, str(Path('staged') / name) + ''.join('#' + label for suffix, label in LABELS.items() if name.endswith('-' + suffix)), '--repo', repo, '--clobber'], check=True)
              print('Uploaded:', name, flush=True)
          # Upload the primary binaries first (GitHub displays assets alphabetically by
          # filename regardless of upload order); remaining distinct assets can
          # transfer concurrently. A receipt is written only after every upload succeeds.
          for row in record['assets'][:5]:
              upload(row)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures = [executor.submit(upload, row) for row in record['assets'][5:]]
              for future in futures:
                  future.result()
          record['passed'] = True
          Path('release-upload-record.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
      - name: Retain the exact uploaded inventory and checksums
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-upload-record
          path: |
            release-upload-record.json
            staged/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
